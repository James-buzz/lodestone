name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12', '13']
        stability: ['prefer-lowest', 'prefer-stable']
        exclude:
          - php: '8.2'
            laravel: '13'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer update --${{ matrix.stability }} --with="laravel/framework:^${{ matrix.laravel }}.0" --prefer-dist --no-interaction

      - run: vendor/bin/phpunit

  # Pint's rules move between releases and older PHP resolves an older Pint, so style is checked once on a fixed PHP.
  pint:
    runs-on: ubuntu-latest

    name: Pint

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: vendor/bin/pint --test

  renderer:
    runs-on: ubuntu-latest

    name: Renderer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run typecheck
